version: '3.8'

services:
  app:
    build: .
    container_name: arg_app
    ports:
      - "8000:8000"
    volumes:
      - ./app/data:/app/app/data
      - ./app/log:/app/app/log
      - ./app/.env:/app/app/.env
    environment:
      - CHATCHAT_ROOT=/app/app
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/langchain_chatchat
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - db
      - qdrant
    restart: unless-stopped
    networks:
      - arg_network

  db:
    image: postgres:15-alpine
    container_name: arg_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langchain_chatchat
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - arg_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: arg_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - arg_network

volumes:
  postgres_data:
  qdrant_data:

networks:
  arg_network:
    driver: bridge